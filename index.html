<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imelid E. Barreto — Enlaces</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6.5.1 cargado para soportar el icono de X correctamente -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cormorant Garamond', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 1s ease, color 1s ease;
      overflow: hidden;
      user-select: none;
    }

    .theme-dark {
      background: radial-gradient(circle at 50% 30%, #17112b 0%, #0c0817 65%, #030209 100%);
      color: #f3f4f6;
    }

    .theme-light {
      background: radial-gradient(circle at 50% 30%, #fffbf0 0%, #f6edd9 65%, #ebdcc3 100%);
      color: #1c1917;
    }

    .glass-panel {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Modal Animation */
    .tooltip-enter {
      animation: tooltipFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes tooltipFade {
      from { opacity: 0; transform: translate(-50%, -85%) scale(0.92); }
      to { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    }
  </style>
</head>

<body class="theme-dark h-screen w-screen relative overflow-hidden flex flex-col justify-between p-6 sm:p-10">

  <!-- Main Dynamic Canvas -->
  <canvas id="gardenCanvas" class="absolute inset-0 w-full h-full z-0 cursor-crosshair"></canvas>

  <!-- Ambient Glow Background -->
  <div id="ambientGlow" class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] rounded-full bg-purple-600/10 dark:bg-purple-900/15 blur-3xl pointer-events-none transition-all duration-1000"></div>

  <!-- Header Section -->
  <header class="relative z-10 w-full flex justify-between items-start pointer-events-auto">
    <div>
      <h1 class="font-serif text-3xl sm:text-5xl font-light tracking-wide italic leading-tight text-purple-950 dark:text-purple-100 transition-colors duration-700">
        Imelid E. Barreto • 🐝🌙🌸
      </h1>
      <p class="text-[10px] sm:text-xs uppercase tracking-[0.3em] text-zinc-600 dark:text-zinc-400 mt-1 font-medium transition-colors duration-700">
        Immy`s Digital side btw!
      </p>
    </div>

    <!-- Dark/Light Theme Switcher -->
    <button id="themeToggleBtn" class="group p-3.5 rounded-full glass-panel bg-white/60 dark:bg-zinc-900/60 border border-zinc-200/70 dark:border-zinc-800/70 shadow-xl hover:scale-105 active:scale-95 transition-all duration-300" aria-label="Cambiar Día/Noche">
      <div class="w-5 h-5 flex items-center justify-center relative">
        <i class="fa-solid fa-sun text-amber-500 text-sm absolute transition-all duration-500 rotate-0 scale-100 dark:-rotate-90 dark:scale-0"></i>
        <i class="fa-solid fa-moon text-indigo-300 text-sm absolute transition-all duration-500 rotate-90 scale-0 dark:rotate-0 dark:scale-100"></i>
      </div>
    </button>
  </header>

  <!-- Center Guidance Text -->
  <div class="relative z-10 text-center my-auto pointer-events-none transition-opacity duration-700 opacity-90">
    <p class="font-serif italic text-xl sm:text-3xl text-zinc-800 dark:text-zinc-200 max-w-lg mx-auto font-light leading-relaxed drop-shadow-sm transition-colors duration-700">
      «The only place that 
      matters is first!»
    </p>
    <div class="mt-4 flex items-center justify-center space-x-2 text-[10px] tracking-[0.25em] text-zinc-600 dark:text-zinc-400 uppercase font-light transition-colors duration-700 pointer-events-auto">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span id="customSubtitle" contenteditable="true" class="outline-none hover:bg-white/20 dark:hover:bg-black/20 focus:bg-white/30 dark:focus:bg-black/30 px-2 py-0.5 rounded transition-all cursor-text" title="Haz clic para editar este texto">MAX EMILIAN VERSTAPPEN • 2021 </span>
    </div>
  </div>

  <!-- Footer & Social Nav Bar -->
  <footer class="relative z-10 w-full flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-auto">
    <p class="text-[10px] text-zinc-600 dark:text-zinc-400 font-light tracking-widest uppercase transition-colors duration-700">
      © 2026 IMELID E. BARRETO • JARDÍN INTERACTIVO 🌿✨
    </p>

    <!-- Social Bar Legend -->
    <div class="flex items-center space-x-2 bg-white/50 dark:bg-zinc-900/50 p-2 rounded-full glass-panel border border-zinc-200/60 dark:border-zinc-800/60 shadow-2xl overflow-x-auto max-w-full">
      <div id="socialLegend" class="flex items-center space-x-2"></div>
    </div>
  </footer>

  <!-- Hover Interactive Card -->
  <div id="butterflyCard" class="fixed pointer-events-auto z-50 hidden -translate-x-1/2 -translate-y-full mb-6 tooltip-enter">
    <div class="p-4 rounded-2xl glass-panel bg-white/95 dark:bg-zinc-900/95 border border-zinc-200 dark:border-zinc-700 shadow-2xl min-w-[230px] text-center backdrop-blur-2xl">
      <div id="cardBadge" class="w-10 h-10 mx-auto rounded-xl flex items-center justify-center text-white mb-2 shadow-lg">
        <i id="cardIcon" class="text-xl"></i>
      </div>
      <h3 id="cardTitle" class="font-serif text-xl font-semibold text-zinc-800 dark:text-zinc-100"></h3>
      <p id="cardSubtitle" class="text-[11px] text-zinc-500 dark:text-zinc-400 font-light mt-0.5 mb-3"></p>
      
      <a id="cardLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center space-x-2 w-full py-2 px-4 rounded-xl text-xs font-semibold text-white transition-all transform hover:scale-[1.03] active:scale-95 shadow-lg">
        <span>IR A LA RED</span>
        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
      </a>
    </div>
  </div>

  <script>
    const SOCIAL_DATA = [
      {
        id: 'twitter',
        name: 'TWITTER (X)',
        subtitle: '@imelid_xlsx • A veces twiteo webonadas!',
        url: 'https://x.com/imelid_xlsx',
        icon: 'fa-brands fa-x-twitter',
        primaryColor: '#000000',
        wingGradient: ['#38bdf8', '#000000']
      },
      {
        id: 'instagram',
        name: 'INSTAGRAM',
        subtitle: '@imelidbarreto • Mi pov con decadencia de mpx',
        url: 'https://www.instagram.com/imelidbarreto/',
        icon: 'fa-brands fa-instagram',
        primaryColor: '#E1306C',
        wingGradient: ['#E1306C', '#833AB4', '#F58529']
      },
      {
        id: 'tiktok',
        name: 'TIKTOK',
        subtitle: '@imelidbarreto',
        url: 'https://www.tiktok.com/@imelidbarreto',
        icon: 'fa-brands fa-tiktok',
        primaryColor: '#00F2FE',
        wingGradient: ['#00F2FE', '#FE2C55', '#000000']
      },
      {
        id: 'goodreads',
        name: 'GOODREADS',
        subtitle: 'imelidb • Lecturas & Libros',
        url: 'https://www.goodreads.com/imelidb',
        icon: 'fa-brands fa-goodreads-g',
        primaryColor: '#8C6239',
        wingGradient: ['#d7ccc8', '#8C6239', '#372213']
      },
      {
        id: 'tumblr',
        name: 'TUMBLR',
        subtitle: 'immyrainbow • y si todavìa lo uso ',
        url: 'https://immyrainbow.tumblr.com/',
        icon: 'fa-brands fa-tumblr',
        primaryColor: '#35465C',
        wingGradient: ['#7A98C4', '#35465C', '#111827']
      },
      {
        id: 'pinterest',
        name: 'PINTEREST',
        subtitle: 'imelidbarreto • Inspiración Visual',
        url: 'https://pin.it/5KO0h2aTg',
        icon: 'fa-brands fa-pinterest-p',
        primaryColor: '#E60023',
        wingGradient: ['#FF4D4D', '#BD081C']
      },
      {
        id: 'spotify',
        name: 'SPOTIFY',
        subtitle: 'Imelid Barreto • Música & Listas',
        url: 'https://open.spotify.com/user/31x742iwfekrtlf4w4j7t5ysqiva',
        icon: 'fa-brands fa-spotify',
        primaryColor: '#1DB954',
        wingGradient: ['#1DB954', '#191414']
      },
      {
        id: 'gmail',
        name: 'GMAIL',
        subtitle: 'imelidbarreto@gmail.com • Contacto',
        url: 'mailto:imelidbarreto@gmail.com',
        icon: 'fa-solid fa-envelope',
        primaryColor: '#EA4335',
        wingGradient: ['#EA4335', '#4285F4', '#FBBC05']
      }
    ];

    const bodyElem = document.body;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const gardenCanvas = document.getElementById('gardenCanvas');
    const ctx = gardenCanvas.getContext('2d');
    const butterflyCard = document.getElementById('butterflyCard');
    const socialLegend = document.getElementById('socialLegend');

    let isDark = true;
    let transitionProgress = 1;

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
        bodyElem.className = 'theme-dark h-screen w-screen relative overflow-hidden flex flex-col justify-between p-6 sm:p-10';
      } else {
        document.documentElement.classList.remove('dark');
        bodyElem.className = 'theme-light h-screen w-screen relative overflow-hidden flex flex-col justify-between p-6 sm:p-10';
      }
    });

    // Populate Legend
    SOCIAL_DATA.forEach(s => {
      const b = document.createElement('button');
      b.className = 'w-8 h-8 rounded-full flex items-center justify-center text-white text-xs transition-all hover:scale-125 shadow-md relative group';
      b.style.backgroundColor = s.primaryColor;
      b.innerHTML = `<i class="${s.icon}"></i>`;
      b.onclick = () => {
        const found = butterflies.find(bf => bf.data.id === s.id);
        if (found) {
          found.targetX = mouse.x > 0 ? mouse.x : width / 2;
          found.targetY = mouse.y > 0 ? mouse.y : height / 2;
          showCard(found);
        }
      };
      socialLegend.appendChild(b);
    });

    // Canvas Size
    let width = 0, height = 0;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      gardenCanvas.width = width * window.devicePixelRatio;
      gardenCanvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    // Mouse Tracking
    const mouse = { x: -1000, y: -1000, isOver: false };
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.isOver = true;
      if (Math.random() > 0.5) addSparks(mouse.x, mouse.y);
    });
    window.addEventListener('mouseleave', () => mouse.isOver = false);

    // Celestial Bodies Rendering (Sun / Moon)
    let sunAngle = 0;
    function drawCelestialBodies() {
      const targetProg = isDark ? 1 : 0;
      transitionProgress += (targetProg - transitionProgress) * 0.05;

      const celestialX = width * 0.82;
      const celestialY = height * 0.22;
      sunAngle += 0.005;

      if (transitionProgress < 0.99) {
        ctx.save();
        ctx.globalAlpha = 1 - transitionProgress;
        ctx.translate(celestialX, celestialY);

        const sunGlow = ctx.createRadialGradient(0, 0, 20, 0, 0, 160);
        sunGlow.addColorStop(0, 'rgba(251, 191, 36, 0.45)');
        sunGlow.addColorStop(0.5, 'rgba(245, 158, 11, 0.15)');
        sunGlow.addColorStop(1, 'rgba(245, 158, 11, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(0, 0, 160, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.rotate(sunAngle);
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.25)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) {
          ctx.rotate(Math.PI / 6);
          ctx.beginPath();
          ctx.moveTo(50, 0);
          ctx.lineTo(75, 0);
          ctx.stroke();
        }
        ctx.restore();

        const sunCore = ctx.createRadialGradient(0, 0, 0, 0, 0, 42);
        sunCore.addColorStop(0, '#ffffff');
        sunCore.addColorStop(0.4, '#fef08a');
        sunCore.addColorStop(0.85, '#f59e0b');
        sunCore.addColorStop(1, '#d97706');
        ctx.fillStyle = sunCore;
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 35;
        ctx.beginPath();
        ctx.arc(0, 0, 42, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      if (transitionProgress > 0.01) {
        ctx.save();
        ctx.globalAlpha = transitionProgress;
        ctx.translate(celestialX, celestialY);

        const moonGlow = ctx.createRadialGradient(0, 0, 25, 0, 0, 150);
        moonGlow.addColorStop(0, 'rgba(199, 210, 254, 0.35)');
        moonGlow.addColorStop(0.5, 'rgba(129, 140, 248, 0.12)');
        moonGlow.addColorStop(1, 'rgba(99, 102, 241, 0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(0, 0, 150, 0, Math.PI * 2);
        ctx.fill();

        const moonCore = ctx.createRadialGradient(-10, -10, 0, 0, 0, 38);
        moonCore.addColorStop(0, '#ffffff');
        moonCore.addColorStop(0.7, '#e0e7ff');
        moonCore.addColorStop(1, '#c7d2fe');
        ctx.fillStyle = moonCore;
        ctx.shadowColor = '#a5b4fc';
        ctx.shadowBlur = 25;
        
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(165, 180, 252, 0.25)';
        ctx.beginPath();
        ctx.arc(-12, -10, 8, 0, Math.PI * 2);
        ctx.arc(10, 12, 11, 0, Math.PI * 2);
        ctx.arc(-5, 16, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    class Flower {
      constructor(x, stemHeight, type, color) {
        this.x = x;
        this.stemHeight = stemHeight;
        this.type = type;
        this.color = color;
        this.swayAngle = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.015 + Math.random() * 0.01;
      }

      draw(ctx) {
        this.swayAngle += this.swaySpeed;
        const swayX = Math.sin(this.swayAngle) * 15;

        const startY = height;
        const endY = height - this.stemHeight;
        const endX = this.x + swayX;

        ctx.save();
        ctx.strokeStyle = isDark ? '#2e4c38' : '#4d7c5d';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(this.x, startY);
        ctx.quadraticCurveTo(this.x + swayX * 0.5, startY - this.stemHeight * 0.5, endX, endY);
        ctx.stroke();

        ctx.fillStyle = isDark ? '#1b3824' : '#386345';
        ctx.beginPath();
        ctx.arc(this.x + swayX * 0.25 - 6, startY - this.stemHeight * 0.3, 8, 0, Math.PI);
        ctx.fill();

        ctx.translate(endX, endY);
        ctx.rotate(Math.sin(this.swayAngle) * 0.1);

        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = isDark ? 10 : 2;

        if (this.type === 'lavender') {
          for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.ellipse(0, -i * 8, 6, 4, Math.PI / 4, 0, Math.PI * 2);
            ctx.ellipse(0, -i * 8, 6, 4, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (this.type === 'tulip') {
          ctx.beginPath();
          ctx.arc(0, -5, 14, 0, Math.PI, false);
          ctx.lineTo(-14, -20);
          ctx.lineTo(-5, -12);
          ctx.lineTo(0, -22);
          ctx.lineTo(5, -12);
          ctx.lineTo(14, -20);
          ctx.closePath();
          ctx.fill();
        } else if (this.type === 'daisy') {
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 8; i++) {
            ctx.rotate(Math.PI / 4);
            ctx.beginPath();
            ctx.ellipse(0, 10, 4, 10, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(0, 0, 6, 0, Math.PI * 2);
          ctx.fill();
        } else {
          for (let r = 14; r > 2; r -= 4) {
            ctx.beginPath();
            ctx.arc((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();
      }
    }

    const flowers = [];
    const flowerTypes = ['lavender', 'tulip', 'daisy', 'rose'];
    const flowerColors = isDark 
      ? ['#a855f7', '#ec4899', '#f43f5e', '#818cf8', '#38bdf8']
      : ['#c084fc', '#f472b6', '#fb7185', '#a7f3d0', '#fef08a'];

    for (let x = 30; x < window.innerWidth + 50; x += 45 + Math.random() * 30) {
      const type = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
      const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
      const stemH = 100 + Math.random() * 120;
      flowers.push(new Flower(x, stemH, type, color));
    }

    class Bee {
      constructor() {
        this.x = Math.random() * width;
        this.y = height - 150 - Math.random() * 200;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.wingPhase = Math.random() * Math.PI * 2;
        this.targetFlower = flowers[Math.floor(Math.random() * flowers.length)];
      }

      update() {
        let tx = this.targetFlower ? this.targetFlower.x : width / 2;
        let ty = this.targetFlower ? height - this.targetFlower.stemHeight : height / 2;

        if (mouse.isOver && Math.hypot(mouse.x - this.x, mouse.y - this.y) < 180) {
          tx = mouse.x;
          ty = mouse.y;
        }

        const dx = tx - this.x;
        const dy = ty - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 30) {
          this.targetFlower = flowers[Math.floor(Math.random() * flowers.length)];
        } else {
          this.vx += (dx / dist) * 0.08;
          this.vy += (dy / dist) * 0.08;
        }

        this.vx *= 0.94;
        this.vy *= 0.94;

        this.x += this.vx;
        this.y += this.vy;
        this.wingPhase += 0.4;
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.vx < 0) ctx.scale(-1, 1);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        const wingY = Math.sin(this.wingPhase) * 6;
        ctx.beginPath();
        ctx.ellipse(-2, -6 + wingY, 4, 7, -Math.PI / 4, 0, Math.PI * 2);
        ctx.ellipse(3, -6 - wingY, 4, 7, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-2, -5.5, 3, 11);
        ctx.fillRect(3, -4.5, 2.5, 9);

        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(-11, -1);
        ctx.lineTo(-11, 1);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    const bees = [new Bee(), new Bee(), new Bee(), new Bee()];

    // === CLASE F1 CAR (MONOPLAZA DE FÓRMULA 1) ===
    class F1Car {
      constructor(number, team, speed, startX, yOffset) {
        this.number = number; // String "#16" o "#3"
        this.team = team;     // 'ferrari' o 'redbull'
        this.speed = speed;
        this.x = startX;
        this.yOffset = yOffset; // Posición vertical respecto a la parte inferior
      }

      update() {
        this.x += this.speed;
        if (this.x > width + 100) {
          this.x = -120;
        }
      }

      draw(ctx) {
        const carY = height - this.yOffset;
        ctx.save();
        ctx.translate(this.x, carY);

        // Sombrilla / Sombra del auto sobre la pista
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 12, 45, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ruedas (4 neumáticos de F1)
        ctx.fillStyle = '#111111';
        // Traseras
        ctx.fillRect(-32, -15, 12, 7);
        ctx.fillRect(-32, 8, 12, 7);
        // Delanteras
        ctx.fillRect(20, -14, 10, 6);
        ctx.fillRect(20, 8, 10, 6);

        // Llantas / Rines
        ctx.fillStyle = this.team === 'ferrari' ? '#f59e0b' : '#3b82f6';
        ctx.fillRect(-28, -13, 4, 3);
        ctx.fillRect(-28, 10, 4, 3);
        ctx.fillRect(23, -12, 4, 2);
        ctx.fillRect(23, 10, 4, 2);

        // Chasis principal
        if (this.team === 'ferrari') {
          ctx.fillStyle = '#dc2626'; // Rojo Ferrari
        } else {
          ctx.fillStyle = '#0f172a'; // Azul Marino Red Bull
        }
        
        ctx.beginPath();
        ctx.moveTo(-35, 0);
        ctx.lineTo(-20, -8);
        ctx.lineTo(15, -6);
        ctx.lineTo(38, -2);
        ctx.lineTo(42, 0);
        ctx.lineTo(38, 2);
        ctx.lineTo(15, 6);
        ctx.lineTo(-20, 8);
        ctx.closePath();
        ctx.fill();

        // Alerón Delantero
        ctx.fillStyle = this.team === 'ferrari' ? '#b91c1c' : '#f59e0b';
        ctx.fillRect(36, -12, 8, 24);

        // Alerón Trasero
        ctx.fillStyle = '#000000';
        ctx.fillRect(-38, -10, 6, 20);

        // Detalle Cockpit / Piloto (Casco)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-2, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        
        // Casco del piloto
        ctx.fillStyle = this.team === 'ferrari' ? '#ffffff' : '#ef4444';
        ctx.beginPath();
        ctx.arc(-2, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        // Detalles específicos de la escudería
        if (this.team === 'ferrari') {
          // Detalle amarillo / blanco Ferrari en el morro
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(10, -2, 12, 4);
        } else {
          // Morro amarillo y detalles rojos Red Bull
          ctx.fillStyle = '#eab308';
          ctx.beginPath();
          ctx.moveTo(20, -4);
          ctx.lineTo(38, -1);
          ctx.lineTo(38, 1);
          ctx.lineTo(20, 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-5, -4, 10, 2);
          ctx.fillRect(-5, 2, 10, 2);
        }

        // Número del Monoplaza (#16 o #3)
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.number, -14, 0);

        ctx.restore();
      }
    }

    // Instancia de los 2 monoplazas (Ferrari #16 y Red Bull #3)
    const f1Cars = [
      new F1Car('16', 'ferrari', 4.8, -100, 28),
      new F1Car('3', 'redbull', 5.2, -260, 16)
    ];

    class ButterflyAgent {
      constructor(data, index, total) {
        this.data = data;
        this.x = Math.random() * (width - 120) + 60;
        this.y = Math.random() * (height - 200) + 80;

        this.vx = (Math.random() - 0.5) * 3.5;
        this.vy = (Math.random() - 0.5) * 3.5;
        this.targetX = this.x;
        this.targetY = this.y;
        this.timer = 0;

        this.scale = 0.45;
        this.wingPhase = Math.random() * Math.PI * 2;
        this.flapSpeed = 0.18;
        this.isHovered = false;
        this.heading = 0;
      }

      update() {
        this.timer--;
        if (this.timer <= 0) {
          this.targetX = 60 + Math.random() * (width - 120);
          this.targetY = 60 + Math.random() * (height - 180);
          this.timer = 40 + Math.random() * 70;
        }

        let dx = this.targetX - this.x;
        let dy = this.targetY - this.y;

        if (mouse.isOver) {
          const mDist = Math.hypot(mouse.x - this.x, mouse.y - this.y);
          if (mDist < 260) {
            dx = mouse.x - this.x;
            dy = mouse.y - this.y;
            this.flapSpeed = 0.28;
          } else {
            this.flapSpeed = 0.18;
          }
        }

        const dist = Math.hypot(dx, dy);
        if (dist > 5) {
          this.vx += (dx / dist) * 0.18;
          this.vy += (dy / dist) * 0.18;
        }

        this.vx *= 0.96;
        this.vy *= 0.96;

        this.x += this.vx;
        this.y += this.vy;

        const targetHeading = Math.atan2(this.vy, this.vx) + Math.PI / 2;
        this.heading += (targetHeading - this.heading) * 0.12;
        this.wingPhase += this.flapSpeed;

        const pad = 50;
        if (this.x < pad) { this.vx += 0.8; this.targetX = width * 0.7; }
        if (this.x > width - pad) { this.vx -= 0.8; this.targetX = width * 0.3; }
        if (this.y < pad) { this.vy += 0.8; this.targetY = height * 0.7; }
        if (this.y > height - pad - 60) { this.vy -= 0.8; this.targetY = height * 0.3; }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.save();
        ctx.font = '600 10px Inter, sans-serif';
        ctx.textAlign = 'center';

        ctx.shadowColor = this.data.primaryColor;
        ctx.shadowBlur = this.isHovered ? 12 : 4;
        
        const textMetrics = ctx.measureText(this.data.name);
        const textWidth = textMetrics.width + 14;
        ctx.fillStyle = isDark ? 'rgba(15, 12, 25, 0.8)' : 'rgba(255, 255, 255, 0.88)';
        ctx.beginPath();
        ctx.roundRect(-textWidth / 2, 28, textWidth, 18, 9);
        ctx.fill();

        ctx.strokeStyle = this.data.primaryColor;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = isDark ? '#ffffff' : '#18181b';
        ctx.fillText(this.data.name, 0, 41);
        ctx.restore();

        ctx.rotate(this.heading);
        const wingScaleX = Math.max(0.12, Math.abs(Math.sin(this.wingPhase)));
        const size = 52 * this.scale;

        const grad = ctx.createLinearGradient(-size, -size, size, size);
        grad.addColorStop(0, this.data.wingGradient[0]);
        grad.addColorStop(0.5, this.data.wingGradient[1] || this.data.wingGradient[0]);
        if (this.data.wingGradient[2]) grad.addColorStop(1, this.data.wingGradient[2]);

        // Left Wing
        ctx.save();
        ctx.scale(wingScaleX, 1);
        ctx.fillStyle = grad;
        ctx.shadowColor = this.data.primaryColor;
        ctx.shadowBlur = this.isHovered ? 20 : 8;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-size * 1.5, -size * 1.3, -size * 1.8, size * 0.3, 0, size * 0.4);
        ctx.bezierCurveTo(-size * 1.2, size * 1.3, -size * 0.4, size * 1.5, 0, size * 0.2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-size * 0.8, -size * 0.4, -size * 1.1, 0);
        ctx.stroke();
        ctx.restore();

        // Right Wing
        ctx.save();
        ctx.scale(-wingScaleX, 1);
        ctx.fillStyle = grad;
        ctx.shadowColor = this.data.primaryColor;
        ctx.shadowBlur = this.isHovered ? 20 : 8;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-size * 1.5, -size * 1.3, -size * 1.8, size * 0.3, 0, size * 0.4);
        ctx.bezierCurveTo(-size * 1.2, size * 1.3, -size * 0.4, size * 1.5, 0, size * 0.2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-size * 0.8, -size * 0.4, -size * 1.1, 0);
        ctx.stroke();
        ctx.restore();

        // Body
        ctx.fillStyle = isDark ? '#090d16' : '#27272a';
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.12, size * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      isPointInside(px, py) {
        return Math.hypot(this.x - px, this.y - py) < 40;
      }
    }

    const butterflies = SOCIAL_DATA.map((d, i) => new ButterflyAgent(d, i, SOCIAL_DATA.length));

    // Particle Trail Logic
    const sparks = [];
    function addSparks(x, y) {
      sparks.push({
        x: x + (Math.random() - 0.5) * 12,
        y: y + (Math.random() - 0.5) * 12,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8 - 0.4,
        alpha: 0.9,
        size: Math.random() * 2.5 + 0.8
      });
    }

    function drawSparks() {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.02;
        if (s.alpha <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = isDark ? '#fef08a' : '#d97706';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let activeButterfly = null;

    function checkHover() {
      let found = null;
      for (let i = butterflies.length - 1; i >= 0; i--) {
        if (butterflies[i].isPointInside(mouse.x, mouse.y)) {
          found = butterflies[i];
          break;
        }
      }

      butterflies.forEach(b => b.isHovered = (b === found));

      if (found !== activeButterfly) {
        activeButterfly = found;
        if (found) showCard(found);
        else hideCard();
      }
    }

    function showCard(b) {
      document.getElementById('cardTitle').innerText = b.data.name;
      document.getElementById('cardSubtitle').innerText = b.data.subtitle;
      
      const badge = document.getElementById('cardBadge');
      badge.style.backgroundColor = b.data.primaryColor;
      
      const icon = document.getElementById('cardIcon');
      icon.className = `${b.data.icon} text-white`;

      const link = document.getElementById('cardLink');
      link.href = b.data.url;
      link.style.backgroundColor = b.data.primaryColor;

      butterflyCard.style.left = `${b.x}px`;
      butterflyCard.style.top = `${b.y}px`;
      butterflyCard.classList.remove('hidden');
    }

    function hideCard() {
      butterflyCard.classList.add('hidden');
    }

    gardenCanvas.addEventListener('click', (e) => {
      const clicked = butterflies.find(b => b.isPointInside(e.clientX, e.clientY));
      if (clicked) {
        window.open(clicked.data.url, '_blank', 'noopener,noreferrer');
      }
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw Celestial Sun/Moon
      drawCelestialBodies();

      // 2. Draw Garden Flowers
      flowers.forEach(f => f.draw(ctx));

      // 3. Draw F1 Cars (Ferrari #16 & Red Bull #3)
      f1Cars.forEach(car => {
        car.update();
        car.draw(ctx);
      });

      // 4. Draw Bees
      bees.forEach(bee => {
        bee.update();
        bee.draw(ctx);
      });

      // 5. Draw Cursor Sparks
      drawSparks();

      // 6. Draw Butterflies
      butterflies.forEach(b => {
        b.update();
        b.draw(ctx);
      });

      // Update Card position if hovering
      if (activeButterfly && !butterflyCard.classList.contains('hidden')) {
        butterflyCard.style.left = `${activeButterfly.x}px`;
        butterflyCard.style.top = `${activeButterfly.y}px`;
      }

      checkHover();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
